CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SC7A20H=y
CONFIG_GPIO=y
# 这里给启动传感器触发模式  如果这里为n 下面的都不需要看了 同时依赖GPIO启动
CONFIG_SC7A20H_TRIGGER=y
#这里也可以为TRIGGER_MODE=2 就为多线程处理
CONFIG_SC7A20H_TRIGGER_MODE=1
#CONFIG_SC7A20H_TRIGGER_NONE=y
#CONFIG_SC7A20H_TRIGGER_OWN_THREAD=y
CONFIG_SC7A20H_THREAD_PRIORITY=10
CONFIG_SC7A20H_THREAD_STACK_SIZE=1024
CONFIG_CBPRINTF_FP_SUPPORT=y
