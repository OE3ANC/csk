CONFIG_PRINTK=y
CONFIG_DEBUG=y
CONFIG_LOG=y
CONFIG_GPIO=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=102400


#psram init 
CONFIG_CSK6001_PSRAM=y
CONFIG_NEWLIB_LIBC=y
CONFIG_TEST_RANDOM_GENERATOR=y

#file system
CONFIG_DISK_DRIVER_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FS_FATFS_CODEPAGE=936
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=255
CONFIG_FS_FATFS_LFN_MODE_BSS=y


#usb mass storage
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Zephyr DFU sample"
CONFIG_USB_MASS_STORAGE=y
CONFIG_MASS_STORAGE_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MASS_STORAGE_DISK_NAME="NAND"

#CONFIG_USB_DRIVER_LOG_LEVEL_ERR=y
#CONFIG_USB_DEVICE_LOG_LEVEL_ERR=y
#CONFIG_USB_MASS_STORAGE_LOG_LEVEL_ERR=y
#CONFIG_USB_DRIVER_LOG_LEVEL_ERR=y


#usb dfu
# CONFIG_USB_DFU_CLASS=y
# CONFIG_IMG_MANAGER=y
# CONFIG_IMG_BLOCK_BUF_SIZE=4096
#CONFIG_BOOTLOADER_MCUBOOT=y

#Fixd for WinUSB driver install.
CONFIG_USB_DEVICE_VID=0x2FE3
CONFIG_USB_DEVICE_PID=0x200

#sof
CONFIG_SOF_HOST=y
CONFIG_AVF_USE_FS_FATFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
#CONFIG_AVF_USE_FS_LITTLEFS=y
#CONFIG_FILE_SYSTEM_LITTLEFS=y

#IPM
CONFIG_IPM=y

#shell
CONFIG_SHELL_ARGC_MAX=16
CONFIG_SHELL=y

#network-driver
CONFIG_SPI=y
#network-wifi
CONFIG_WIFI=y
CONFIG_WIFI_CSK6001=y
CONFIG_CSK_WIFI_STATION=y
CONFIG_NET_L2_ETHERNET=y
#networking
CONFIG_NETWORKING=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=3000
CONFIG_NET_SOCKETS_POSIX_NAMES=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=15360
CONFIG_NET_TX_STACK_SIZE=15360
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_CONTEXT_NET_PKT_POOL=y

CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"

CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-1
CONFIG_INIT_STACKS=y

# Network debug config
# CONFIG_NET_LOG=y

# HTTP & Websocket
CONFIG_HTTP_CLIENT=y
CONFIG_WEBSOCKET_CLIENT=n

# TLS configuration
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=10240
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=2048

# to enable TLS
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=10

# ListenAI moudle support
# zephyr System abstraction layer for other rtos, like freertos
CONFIG_ZPORT_SAL=y
# sal port to esp
CONFIG_ZPORT_ESP=y
# esp http & websocket
CONFIG_ZE_TCP_TRANSPORT=y
CONFIG_ZE_TCP_TRANSPORT_ENABLE_SSL=y
CONFIG_ZE_HTTP_CLIENT=y
CONFIG_ZE_HTTP_CLIENT_ENABLE_HTTPS=y
CONFIG_ZE_WEBSOCKET_CLIENT=y
CONFIG_BASE64=y
# esp adf - pipeline
CONFIG_ZE_ADF=y
CONFIG_ZE_ADF_HTTP_STREAM_ENABLE=y
CONFIG_ZE_ADF_FS_STREAM_ENABLE=y
CONFIG_ZE_ADF_MEMORY_STREAM_ENABLE=y
CONFIG_ZE_ADF_AVF_STREAM_ENABLE=y
# lisa player
CONFIG_LISA_PLAYER=y
CONFIG_LISA_PLAYER_AUDIO_STRCASECMP_ENABLE=y

# Custom config for example
CONFIG_LISA_PLAYER_SHELL_ENABLE=y
CONFIG_LISA_PLAYER_SHELL_DEFINE_FILE="/NAND:/{{YOUR_FILE_NAME}}.wav"
# setup local http_server in ./temp/ folder:
# Linux: export LISA_ZEP_EXEC=1 && lisa zep exec python -m http.server 8080
# Windows: set LISA_ZEP_EXEC=1 && lisa zep exec python -m http.server 8080
# 打开 http://127.0.0.1:8080
CONFIG_LISA_PLAYER_SHELL_DEFINE_URL="http://{{YOUR_PC_IP}}:8080/fdf7ea5d44626d0319e2fac116019d4af.wav"

# config wifi
CONFIG_EXAMPLE_WIFI_SSID="{{YOUR_WIFI_SSID}}"
CONFIG_EXAMPLE_WIFI_PASSWORD="{{YOUR_WIFI_PASSWORD}}"

# Enable Testing

# shell: ze_http_client test_start
CONFIG_ZE_HTTP_CLIENT_TEST_SHELL=y

# shell: ze_websocket_client test_start
CONFIG_ZE_WEBSOCKET_CLIENT_TEST_SHELL=y
# websocket server test paltform: http://www.easyswoole.com/wstool.html
CONFIG_ZE_WEBSOCKET_CLIENT_TEST_URI="ws://82.157.123.54:9010/ajaxchattest"

#shell
CONFIG_SHELL_ARGC_MAX=16
CONFIG_SHELL=y

CONFIG_TEST_RANDOM_GENERATOR=y