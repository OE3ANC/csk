sample:
  name: USB audio headset sample
tests:
  sample.board.csk6.subsys.usb.audio.headset:
    depends_on: usb_device
    build_only: true
    tags: usb
    platform_allow:
      - csk6002_9s_nano
      - csk6011a_nano
      - csk6012_nano
      - csk6_duomotai_devkit
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Found USB Headset Device"
        - "USB enabled"
