# SPDX-License-Identifier: Apache-2.0

description: GC0328 CMOS video sensor

compatible: "galaxyc,gc0328"

properties:
    reset-gpios:
      type: phandle-array
      required: false
      description: |
        The RESET pin is asserted to disable the sensor causing a hard
        reset.  The sensor receives this as an active-low signal.

    pwdn-gpios:
      type: phandle-array
      required: false
      description: |
        The PWDN pin is asserted to disable the sensor causing a power
        down.  The sensor receives this as an active-high signal.

include: i2c-device.yaml