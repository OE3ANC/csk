description: listenai csk spi controller

include: spi-controller.yaml

compatible: "listenai,csk-spi"

properties:
    reg:
      required: true

    interrupts:
      required: true

    miso-gpios:
      type: phandle-array
      required: false
      description: MISO pin

    mosi-gpios:
      type: phandle-array
      required: false
      description: MOSI pin

    sclk-gpios:
      type: phandle-array
      required: false
      description: SPI generated clock pin

    spi-max-frequency:
      type: int
      required: false
      description: spi-max-frequency
