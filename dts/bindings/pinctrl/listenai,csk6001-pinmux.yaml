description: LISTENAI CSK6001 pinmux (aka IOCON) node

compatible: "listenai,csk-pinmux"

include: base.yaml

properties:
    ph-reg:
      type: phandle
      required: true

    "#pinmux-cells":
      type: int
      required: true
      const: 2
      description: number of items in a pinmux specifier


pinmux-cells:
  - pin
  - function
  