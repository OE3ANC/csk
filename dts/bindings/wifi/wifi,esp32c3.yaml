# SPDX-License-Identifier: Apache-2.0

description: esp-hosted wifi module

compatible: "wifi,esp32c3"

properties:
    spi_port:
      type: int
      required: true
      enum:
       - 0
       - 1

    dataready-gpios:
      type: phandle-array
      required: true

    handshake-gpios:
      type: phandle-array
      required: true

    reset-gpios:
      type: phandle-array
      required: true

    label:
      required: true
      type: string
