description: three-axis qmi8658c motion tracking device

compatible: "listenai,qmi8658c"

include: [sensor-device.yaml, i2c-device.yaml]

properties:
  int-gpios:
    type: phandle-array
    description: |
      The INT signal default configuration is active-high.  The
      property value should ensure the flags properly describe the
      signal that is presented to the driver.
  # accel-range:
  #   type: int
  #   description: |
  #     Accelerometer measurement range selection.  (e.g 2/4/8/16g)
  #     required: true
