description: |
  Input driver for ADC attached resistor ladder buttons

  Example:

  #include <dt-bindings/input/input-event-codes.h>

  / {
          buttons {
                  compatible = "zephyr,adc-keys";
                  io-channels = <&adc 2>;
                  keyup-threshold-mv = <0>;

                  button_0 {
                          press-threshold-mv = <1650>, <2536>;
                          zephyr,code = <INPUT_KEY_0>;
                  };

                  button_1 {
                          press-threshold-mv = <2300>, <2536>;
                          zephyr,code = <INPUT_KEY_1>;
                  };
          };
  };

compatible: "zephyr,adc-keys"

include: kscan.yaml

properties:
  io-channels:
    type: phandle-array
    required: true
    description: Phandle to an ADC channel

  sample-period-ms:
    type: int
    default: 20
    description: |
       Sample period in milliseconds.
       If not specified defaults to 20.

  keyup-threshold-mv:
    type: int
    required: true
    description: |
      Millivolt value to which all the keys are considered up.

child-binding:
  description: ADC KEYS child node
  properties:
    press-thresholds-mv:
      type: array
      required: true
      description: |
        Array of millivolt values to consider a key pressed.
    label:
      type: string
      description: Descriptive name of the key
    zephyr,code:
      type: int
      default: 0
      description: Key code to emit.
      required: true
