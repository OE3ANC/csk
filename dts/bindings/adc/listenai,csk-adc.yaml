# SPDX-License-Identifier: Apache-2.0

description: CSK ADC node

compatible: "listenai,csk-adc"

include: adc-controller.yaml

properties:
    reg:
      required: true

    interrupts:
      required: true

    pinmuxs:
      type: phandle-array
      required: true
      description: pinmuxs for each channel

    pinmux-names:
      type: string-array
      required: true
      description: channel index


    "#io-channel-cells":
      const: 1

io-channel-cells:
    - input

